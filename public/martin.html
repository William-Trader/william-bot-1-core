<style>
/* ==========================================================================
 * martin.html 局部样式 —— 只允许 var(--ds-*)，禁止裸色值
 * ========================================================================== */

/* hidden 属性优先级修复（.wb-badge 等类带 display，会盖掉 UA 的 hidden 规则） */
[hidden] { display: none !important; }

/* ---- 区块切换（hash 路由单页） ---- */
.page-section { display: none; }
.page-section.is-active { display: block; }
.page-section > * + * { margin-top: var(--ds-space-4); }

.sec-head { display: flex; align-items: center; gap: var(--ds-space-3); flex-wrap: wrap; }
.sec-title { font-size: var(--ds-fs-l); font-weight: 700; }
.sec-side { margin-left: auto; display: flex; align-items: center; gap: var(--ds-space-2); flex-wrap: wrap; }

/* ---- 警示条 ---- */
.wb-alert {
  padding: var(--ds-space-2) var(--ds-space-3);
  border-radius: var(--ds-radius-m);
  border: 1px solid var(--ds-border-2);
  font-size: var(--ds-fs-s);
  color: var(--ds-text-secondary);
}
.wb-alert.is-warning { background: var(--ds-warning-bg); border-color: var(--ds-warning-bd); color: var(--ds-warning); }
.wb-alert.is-danger  { background: var(--ds-danger-bg);  border-color: var(--ds-danger-bd);  color: var(--ds-danger); }

/* ---- 卡片危险态（配合 wb-card 使用） ---- */
.wb-card.is-warn { border-left: 3px solid var(--ds-warning); }
.wb-card.is-danger { background: var(--ds-danger-bg); border-left: 4px solid var(--ds-danger); }
.wb-card.is-critical {
  border: 1px solid var(--ds-critical);
  border-left: 4px solid var(--ds-critical);
  animation: wbPulse 1.5s ease-in-out infinite;
}
.crit-text { color: var(--ds-critical); }

/* ---- 键值指标网格（资金效率 / 回测 / 验算 headline 共用） ---- */
.kv-grid { display: grid; gap: var(--ds-space-3); grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kv { min-width: 0; }
.kv .kv-label { font-size: var(--ds-fs-xs); color: var(--ds-text-secondary); }
.kv .kv-value {
  font-size: var(--ds-fs-m); font-weight: 600;
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
}

/* ---- 工具行 ---- */
.toolbar {
  display: flex; align-items: center; gap: var(--ds-space-3); flex-wrap: wrap;
  font-size: var(--ds-fs-xs); color: var(--ds-text-secondary);
}
.toolbar .spacer { margin-left: auto; }

/* ---- 篮子卡 ---- */
.basket-head { display: flex; align-items: center; justify-content: space-between; gap: var(--ds-space-3); flex-wrap: wrap; }
.basket-head .bh-left { display: flex; align-items: center; gap: var(--ds-space-2); flex-wrap: wrap; min-width: 0; }
.basket-inst { font-size: var(--ds-fs-m); font-weight: 700; }
.basket-head .bh-right { display: flex; align-items: center; gap: var(--ds-space-2); font-size: var(--ds-fs-xs); color: var(--ds-text-secondary); }
.lvl-bar { width: 84px; height: 6px; background: var(--ds-bg-inset); border-radius: var(--ds-radius-s); overflow: hidden; }
.lvl-bar > i { display: block; height: 100%; background: var(--ds-brand-8); }
.basket-grid {
  display: grid; gap: var(--ds-space-2) var(--ds-space-4);
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  margin-top: var(--ds-space-2);
}
.bcell .b-label { font-size: var(--ds-fs-xs); color: var(--ds-text-secondary); }
.bcell .b-value { font-size: var(--ds-fs-s); font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.basket-foot {
  display: flex; align-items: center; gap: var(--ds-space-2) var(--ds-space-4); flex-wrap: wrap;
  margin-top: var(--ds-space-3); padding-top: var(--ds-space-2);
  border-top: 1px solid var(--ds-border-1);
  font-size: var(--ds-fs-xs); color: var(--ds-text-secondary);
}
.basket-foot .fp b { font-variant-numeric: tabular-nums; font-weight: 600; }

/* ---- 详情展开网格（候选池等） ---- */
.detail-grid { display: flex; flex-wrap: wrap; gap: var(--ds-space-2) var(--ds-space-5); }
.detail-item b { color: var(--ds-text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---- 折叠说明 ---- */
.wb-details { font-size: var(--ds-fs-xs); color: var(--ds-text-secondary); }
.wb-details > summary { cursor: pointer; color: var(--ds-text-secondary); padding: var(--ds-space-1) 0; }
.wb-details > summary:hover { color: var(--ds-text-primary); }
.wb-details .details-body { padding: var(--ds-space-2) 0 var(--ds-space-2) var(--ds-space-3); line-height: 1.7; }

/* ---- 报告区块：左列表 + 右查看器 ---- */
.rep-wrap { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: var(--ds-space-4); align-items: start; }
.rep-list { display: flex; flex-direction: column; gap: var(--ds-space-1); max-height: 70vh; overflow-y: auto; }
.rep-group-title {
  font-size: var(--ds-fs-xs); color: var(--ds-text-placeholder);
  padding: var(--ds-space-2) var(--ds-space-2) 0; letter-spacing: 1px;
}
.rep-item {
  display: flex; flex-direction: column; gap: 2px;
  padding: var(--ds-space-2); border-radius: var(--ds-radius-m);
  cursor: pointer; border: 1px solid transparent;
}
.rep-item:hover { background: var(--ds-bg-container-hover); }
.rep-item.is-active { background: var(--ds-bg-container-hover); border-color: var(--ds-brand-8); }
.rep-item .rep-name { font-size: var(--ds-fs-s); font-weight: 600; overflow-wrap: anywhere; }
.rep-item .rep-meta { font-size: var(--ds-fs-xs); color: var(--ds-text-placeholder); font-variant-numeric: tabular-nums; }
.rep-viewer { min-height: 300px; }
.md-view { font-family: ui-monospace, "SF Mono", Consolas, "Courier New", monospace; font-size: var(--ds-fs-xs); line-height: 1.7; overflow-x: auto; }
.md-view .md-line { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1em; }
.md-view .md-h { font-weight: 700; color: var(--ds-brand-9); margin-top: var(--ds-space-3); }
.md-view .md-h1 { font-size: var(--ds-fs-m); }
.md-view .md-h2 { font-size: var(--ds-fs-s); }
.md-view .md-code {
  background: var(--ds-bg-inset); border: 1px solid var(--ds-border-1);
  border-radius: var(--ds-radius-m); padding: var(--ds-space-2) var(--ds-space-3);
  margin: var(--ds-space-2) 0; white-space: pre-wrap; overflow-wrap: anywhere;
}

/* ---- 日志时间线 ---- */
.log-box {
  max-height: 62vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: var(--ds-space-2);
  padding-right: var(--ds-space-2);
}
.log-item { display: flex; align-items: baseline; gap: var(--ds-space-2); font-size: var(--ds-fs-s); }
.log-item .log-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.log-item .wb-fresh { flex-shrink: 0; }

/* ---- 参数区块：左锚点 + 右字段组 + sticky 底条 ---- */
.policy-wrap { display: grid; grid-template-columns: 180px 1fr; gap: var(--ds-space-4); align-items: start; }
.policy-nav { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 2px; }
.policy-nav a {
  display: block; padding: var(--ds-space-1) var(--ds-space-2);
  border-radius: var(--ds-radius-m); font-size: var(--ds-fs-s);
  color: var(--ds-text-secondary);
}
.policy-nav a:hover { background: var(--ds-bg-container-hover); color: var(--ds-text-primary); }
.policy-nav a.is-active { color: var(--ds-brand-9); font-weight: 600; box-shadow: inset 2px 0 0 var(--ds-brand-8); }
.preset-bar { display: flex; align-items: center; gap: var(--ds-space-2); flex-wrap: wrap; }
.preset-bar .preset-label { font-size: var(--ds-fs-xs); color: var(--ds-text-secondary); }
.policy-bar {
  position: sticky; bottom: var(--ds-space-3); z-index: 10;
  display: flex; align-items: center; gap: var(--ds-space-3); flex-wrap: wrap;
  background: var(--ds-bg-container);
  border: 1px solid var(--ds-border-2); border-radius: var(--ds-radius-l);
  padding: var(--ds-space-3) var(--ds-space-4);
  box-shadow: var(--ds-shadow-pop);
}
.policy-bar .dirty-count { font-size: var(--ds-fs-s); color: var(--ds-text-secondary); font-variant-numeric: tabular-nums; }
.policy-bar .bar-actions { margin-left: auto; display: flex; gap: var(--ds-space-2); }
.field-warn { margin-left: var(--ds-space-1); }
.msg-list { display: flex; flex-direction: column; gap: 2px; margin: 0; padding-left: var(--ds-space-4); }
.msg-list li { font-size: var(--ds-fs-xs); }

/* ---- 响应式 ---- */
@media (max-width: 1024px) {
  .rep-wrap { grid-template-columns: 1fr; }
  .rep-list { max-height: 240px; }
  .policy-wrap { grid-template-columns: 1fr; }
  .policy-nav { position: static; flex-direction: row; flex-wrap: wrap; gap: var(--ds-space-1); }
}
@media (max-width: 390px) {
  .sec-title { font-size: var(--ds-fs-m); }
  .basket-grid { grid-template-columns: repeat(2, 1fr); }
  .kv-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>

<script>
/* ==========================================================================
 * martin.html 本页逻辑 —— 策略基站主面板（8 内容区块 + 2 外链）
 * 依赖 app.js 提供的 WB：shell/api/poll/fmt/freshHTML/badge/empty/toast/
 * confirm/drawer/priceAxis/prefs/esc。全部字段访问防御式，缺字段降级 "--"。
 * ========================================================================== */
(function () {

  /* 今日盈亏：优先后端「交易所口径」（已实现+费+资金费+未实现；入金不算盈亏），否则回落 权益−权益起点。
     ⚠️ 必须定义在顶层作用域：renderStats 与 renderOverview 两处都会调用。 */
  function dayPnlOf(st) {
    if (st && typeof st.todayPnlUsd === 'number' && st.todayPnlSource === 'okx.bills+tradepnl') return st.todayPnlUsd;
    var e = Number(st && st.equity) || 0, d = Number(st && st.dayStartEquity) || 0;
    return (e && d) ? (e - d) : NaN;
  }
'use strict';

var esc = WB.esc, fmt = WB.fmt, badge = WB.badge, fresh = WB.freshHTML;

/* ---------------- 防御式小工具 ---------------- */

/** 严格转数：null/undefined/'' 视为缺失 */
function num(v) { return (v === null || v === undefined || v === '') ? NaN : Number(v); }
function ok(v) { return isFinite(num(v)); }
/** 数字或 '--' */
function val(v, d) { var n = num(v); return isFinite(n) ? fmt.num(n, d === undefined ? 2 : d) : '--'; }
/** 美元或 '--' */
function usd(v) { var n = num(v); return isFinite(n) ? fmt.usd(n) : '--'; }
/** 百分数（输入已是百分数）或 '--' */
function pct(v, d) { var n = num(v); return isFinite(n) ? fmt.pct(n, d === undefined ? 2 : d) : '--'; }
/** 带符号数字（用于盈亏） */
function signed(v, d) {
  var n = num(v);
  if (!isFinite(n)) return '--';
  return (n > 0 ? '+' : '') + fmt.num(n, d === undefined ? 2 : d);
}
/** 涨跌色 class */
function updown(v) { var n = num(v); return !isFinite(n) || n === 0 ? '' : (n > 0 ? 'up' : 'down'); }
/** 大额缩写：1.96亿→195.9M，12.3亿→1.23B */
function compactUsd(v) {
  var n = num(v);
  if (!isFinite(n)) return '--';
  var a = Math.abs(n);
  if (a >= 1e9) return fmt.num(n / 1e9, 2) + 'B';
  if (a >= 1e6) return fmt.num(n / 1e6, 1) + 'M';
  if (a >= 1e3) return fmt.num(n / 1e3, 1) + 'K';
  return fmt.num(n, 2);
}
/** 毫秒间隔 → 可读文本（"5 分钟"/"30s"） */
function durMs(ms) {
  var n = num(ms);
  if (!isFinite(n)) return '--';
  var s = Math.round(n / 1000);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.round(s / 60) + ' 分钟';
  return (s / 3600).toFixed(1) + ' 小时';
}
/** 卡片错误态 */
function errBox(msg) {
  return '<div class="wb-alert is-danger">⛔ 加载失败：' + esc(msg || '未知错误') + '（下轮自动重试）</div>';
}
/** 骨架 */
function skelCards(n) {
  var s = '';
  for (var i = 0; i < n; i++) s += '<div class="wb-skel wb-skel-card"></div>';
  return s;
}
/** 报错只 toast 一次（避免轮询刷爆） */
var toastOnceFlags = {};
function toastOnce(key, msg, type) {
  if (toastOnceFlags[key]) return;
  toastOnceFlags[key] = true;
  WB.toast(msg, type || 'error');
}
function toastReset(key) { delete toastOnceFlags[key]; }

/** 从 state 里防御式找止盈单方式（market/limit），找不到返回 null */
function tpOrderType(st) {
  if (!st || typeof st !== 'object') return null;
  var v = st.takeProfitOrderType || st.tpOrderType || st.tpOrder ||
          (st.tpStats && (st.tpStats.orderType || st.tpStats.type)) || null;
  if (v === 'market' || v === 'limit') return v;
  return null;
}

/** 从 state 里防御式找熔断字段 */
function breakerInfo(st) {
  if (!st || typeof st !== 'object') return null;
  var b = st.circuitBreaker || st.breaker || st.fuse || st.halt || st.circuit || null;
  if (!b) return null;
  if (typeof b === 'boolean') return { triggered: b };
  if (typeof b === 'object') return b;
  return null;
}

/** 外部服务单元（state 缺字段则 null） */
function externalServices(st) {
  if (!st || typeof st !== 'object') return null;
  return st.externalServices || st.services || st.units || null;
}

async function onPause() {
  var sch = (S.state && S.state.scheduler) || {};
  var running = sch.running !== false;
  var yes = await WB.confirm(
    running ? '暂停调度？' : '恢复调度？',
    running ? '暂停后不再巡检篮子与选品；在仓篮子不会被自动止盈止损，请确认。'
            : '恢复后调度器将继续 30s 巡检 / 定时选品。');

/** 资金效率 6 指标（能算则算，算不了 "--"） */
function computeEfficiency() {
  var st = S.state || {};
  var bt = S.baskets || {};
  var eq = num(st.equity);
  var mu = bt.totals ? num(bt.totals.marginUsed) : NaN;
  var free = (isFinite(eq) && isFinite(mu)) ? eq - mu : NaN;
  var occ = (isFinite(eq) && eq > 0 && isFinite(mu)) ? mu / eq * 100 : NaN;
  var meta = (S.policy && S.policy.meta) || {};
  var cur = (S.policy && S.policy.current) || {};
  var full = num(meta.fullOccupancyPct);
  var single = NaN;
  if (isFinite(eq) && ok(cur.firstMarginPct) && ok(cur.leverage)) {
    single = eq * num(cur.firstMarginPct) / 100 * num(cur.leverage);
  }
  return [
    { k: '账户权益', v: usd(eq) },
    { k: '已占用保证金', v: usd(mu) },
    { k: '闲置可用', v: usd(free) },
    { k: '实际占用率', v: pct(occ) },
    { k: '满层占用上限', v: pct(full) },
    { k: '单层名义预算', v: usd(single) },
  ];
}

function renderEfficiencyInto(elId) {
  var el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML = computeEfficiency().map(function (m) {
    return '<div class="kv"><div class="kv-label">' + esc(m.k) + '</div>' +
      '<div class="kv-value">' + esc(m.v) + '</div></div>';

}

/** 智能格式化：按 key 名猜测单位 */
function fmtSmart(key, v) {
  var n = num(v);
  if (!isFinite(n)) return String(v == null ? '--' : v);
  var k = String(key).toLowerCase();
  if (/pct|rate/.test(k)) { var x = Math.abs(n) <= 1 ? n * 100 : n; return fmt.num(x, 2) + '%'; }
  if (/bps/.test(k)) return fmt.num(n, 1) + ' bps';
  if (/usd|equity|pnl|fee|cost|expectancy/.test(k)) return fmt.usd(n);
  if (/ms$/.test(k)) return fmt.num(n, 0) + ' ms';
  if (Number.isInteger(n)) return fmt.num(n, 0);
  return fmt.num(n, Math.abs(n) >= 1 ? 2 : 4);
}

/** 通用 kv 网格（标量字段，label 中文映射） */
function kvGrid(obj, labels) {
  if (!obj || typeof obj !== 'object') return '';
  var cells = '';
  Object.keys(obj).forEach(function (k) {
    var v = obj[k];
    if (v && typeof v === 'object') return; // 嵌套对象另行处理
    var label = (labels && labels[k]) || BT_LABELS[k] || k;
    cells += '<div class="kv"><div class="kv-label">' + esc(label) + '</div>' +
      '<div class="kv-value">' + esc(fmtSmart(k, v)) + '</div></div>';
  });
  return cells ? '<div class="kv-grid">' + cells + '</div>' : '';
}

/* ==================== 2. 篮子 baskets ==================== */

var CLOSE_REASON = { take_profit: '止盈', stop: '止损', time: '超时', unknown: '其他' };

async function loadBaskets() {
  try {
    var d = await WB.api.get('/api/martin/baskets');
    S.baskets = d;
    if (typeof renderEfficiencyInto === 'function') { renderEfficiencyInto('ov-eff'); if (document.getElementById('pnl-eff')) renderEfficiencyInto('pnl-eff'); }
    toastReset('baskets');
    renderBaskets(d);
    // 资金效率依赖 baskets.totals，顺手刷新
    if (activeSection === 'overview') renderEfficiencyInto('ov-eff');
    if (activeSection === 'pnl') renderEfficiencyInto('pnl-eff');
  } catch (e) {
    toastOnce('baskets', '篮子加载失败：' + (e && e.error || '网络错误'));
    document.getElementById('bk-list').innerHTML = errBox(e && e.error);
    document.getElementById('bk-history').innerHTML = '';
  }
}

function renderBaskets(d) {
  var list = Array.isArray(d.baskets) ? d.baskets : [];
  var sideEl = document.getElementById('bk-side');
  if (sideEl) {
    sideEl.innerHTML = '<span class="tiny muted num">在仓 ' + esc(val(d.count, 0)) + ' / ' + esc(val(d.maxBaskets, 0)) +
      (d.totals ? ' · 合计保证金 ' + esc(usd(d.totals.marginUsed)) + ' · 浮盈 <span class="' + updown(d.totals.upl) + '">' + esc(signed(d.totals.upl) + ' U') + '</span>' : '') + '</span>';
  }

  // paused 警示条
  var alertEl = document.getElementById('bk-alert');
  if (d.paused === true) {
    alertEl.hidden = false;
    alertEl.innerHTML = '<div class="wb-alert is-warning">⚠ 开仓已暂停（paused=true）：不会再开新篮，已有篮子继续管理。</div>';
  } else {
    alertEl.hidden = true;
    alertEl.innerHTML = '';
  }

  // 篮子卡
  var host = document.getElementById('bk-list');
  if (!list.length) {
    host.innerHTML = WB.empty('当前无篮子', '在候选池点「开篮·预览」可创建。', '🧺');
  } else {
    host.innerHTML = list.map(basketCard).join('');
    // 价格轴需要真实 DOM 挂载
    var axes = host.querySelectorAll('.basket-axis');
    list.forEach(function (b, i) {
      if (!axes[i]) return;
      var liq = ok(b.liqPxReal) ? num(b.liqPxReal) : num(b.liquidationPx);
      WB.priceAxis(axes[i], {
        liq: liq, stop: b.stopPx, avg: b.avgPx, add: b.nextAddPx,
        tp: b.takeProfitPx, price: b.lastPrice, atrPct: b.atrPct,
        side: b.side === 'short' ? 'short' : 'long',
      });
    });
  }

  // 已平仓历史
  renderBasketHistory(Array.isArray(d.history) ? d.history.slice(-20).reverse() : []);
}

function basketCard(b) {
  var ghost = b.posMissingAt !== null && b.posMissingAt !== undefined;
  var px = num(b.lastPrice), stop = num(b.stopPx);
  var stopDistPct = (isFinite(px) && px > 0 && isFinite(stop)) ? Math.abs(px - stop) / px * 100 : NaN;
  var nearStop = isFinite(stopDistPct) && stopDistPct < 10;

  var cls = 'wb-card basket-card' + (ghost ? ' is-critical' : nearStop ? ' is-danger' : '');
  var sideBadge = b.side === 'short' ? badge('做空 short', 'danger') : badge('做多 long', 'success');
  var lc = num(b.levelCount), ml = num(b.maxLevels);
  var lvlPct = (isFinite(lc) && isFinite(ml) && ml > 0) ? Math.max(0, Math.min(100, lc / ml * 100)) : 0;

  var head = '<div class="basket-head">' +
    '<div class="bh-left"><span class="basket-inst">' + esc(b.instId || '--') + '</span>' +
      sideBadge +
      (b.sector ? badge(b.sector, 'neutral') : '') +
      (ghost ? badge('幽灵仓', 'danger') : '') +
      (nearStop && !ghost ? badge('接近止损 ' + fmt.num(stopDistPct, 1) + '%', 'danger') : '') +
    '</div>' +
    '<div class="bh-right"><span>持仓 <b class="num">' + esc(val(b.heldH, 1)) + 'h</b></span>' +
      '<span>层 <b class="num">' + esc(ok(lc) ? fmt.num(lc, 0) : '--') + '/' + esc(ok(ml) ? fmt.num(ml, 0) : '--') + '</b></span>' +
      '<span class="lvl-bar"><i style="width:' + lvlPct.toFixed(0) + '%"></i></span>' +
    '</div></div>';

  var grid = '<div class="basket-grid">' +
    bcell('均价', val(b.avgPx, 4)) +
    bcell('浮盈', '<span class="' + updown(b.upl) + '">' + esc(signed(b.upl) + ' U') + ' / ' + esc(signed(b.uplPct, 2) + '%') + '</span>', true) +
    bcell('保证金', usd(b.marginUsd)) +
    bcell('名义', usd(b.notionalUsd)) +
    bcell('下一加仓价', val(b.nextAddPx, 4)) +
    bcell('ATR%', pct(b.atrPct)) +
    '</div>';

  var liq = ok(b.liqPxReal) ? num(b.liqPxReal) : num(b.liquidationPx);
  var foot = '<div class="basket-foot">' +
    '<span class="fp">止盈 <b class="up">' + esc(val(b.takeProfitPx, 4)) + '</b></span>' +
    '<span class="fp">止损 <b class="down">' + esc(val(b.stopPx, 4)) + '</b></span>' +
    '<span class="fp">爆仓 <b class="crit-text">' + esc(isFinite(liq) ? fmt.num(liq, 4) : '--') + '</b>' +
      (ok(b.liqPxReal) ? '' : ' <span class="tiny muted">(估算)</span>') + '</span>' +
    '<span class="fp">兜底 ≤ <b>' + esc(usd(b.stopUsd)) + '</b></span>' +
    '<span class="fp">' + (ok(b.lastQuoteAt) ? '行情 ' + fresh(b.lastQuoteAt, { warn: 60, crit: 300 }) : '行情 --') + '</span>' +
    '</div>';

  return '<div class="' + cls + '">' + head + '<div class="basket-axis"></div>' + grid + foot + '</div>';
}

function bcell(label, valueHtml, raw) {
  return '<div class="bcell"><div class="b-label">' + esc(label) + '</div>' +
    '<div class="b-value">' + (raw ? valueHtml : esc(valueHtml)) + '</div></div>';
}

function renderBasketHistory(hist) {
  var el = document.getElementById('bk-history');
  if (!hist.length) {
    el.innerHTML = WB.empty('暂无已平仓记录', '', '🗂️');
    return;
  }
  var rows = hist.map(function (h) {
    var reason = CLOSE_REASON[h.closeReason] || '其他';
    return '<tr>' +
      '<td><b>' + esc(h.instId || '--') + '</b></td>' +
      '<td>' + (h.side === 'short' ? badge('空', 'danger') : h.side === 'long' ? badge('多', 'success') : '--') + '</td>' +
      '<td class="num">' + esc(val(h.levelCount, 0)) + '</td>' +
      '<td>' + esc(reason) + '</td>' +
      '<td class="num">' + esc(ok(h.closedAt) ? fmt.time(h.closedAt) : '--') + '</td>' +
      '<td class="num ' + updown(h.realizedPnl) + '">' + esc(signed(h.realizedPnl) + ' U') + '</td>' +
      '</tr>';
  }).join('');
  el.innerHTML = '<div class="wb-table-wrap"><table class="wb-table"><thead><tr>' +
    '<th>标的</th><th>方向</th><th class="num">层数</th><th>平仓原因</th><th class="num">平仓时间</th><th class="num">已实现盈亏</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

var REGIME = {
  trend_up: ['上升趋势', 'success'], range: ['震荡', 'neutral'],
  trend_down: ['下降趋势', 'danger'], unclear: ['过渡/不明', 'warning'],
};

async function loadCandidates() {
  try {
    var d = await WB.api.get('/api/martin/candidates');
    S.candidates = d;
    toastReset('candidates');
    renderCandidates(d);
  } catch (e) {
    toastOnce('candidates', '候选池加载失败：' + (e && e.error || '网络错误'));
    document.getElementById('cd-table').innerHTML = errBox(e && e.error);
  }
}

function allowBadge(arr) {
  if (!Array.isArray(arr) || !arr.length) return badge('不开新仓', 'neutral');
  var hasL = arr.indexOf('long') >= 0, hasS = arr.indexOf('short') >= 0;
  if (hasL && hasS) return badge('双向', 'brand');
  if (hasL) return badge('只多', 'success');
  if (hasS) return badge('只空', 'danger');
  return badge('不开新仓', 'neutral');
}

function renderCandidates(d) {
  var uni = d.universe || {};
  var picked = Array.isArray(d.picked) ? d.picked : [];

  // 工具行
  document.getElementById('cd-toolbar').innerHTML =
    '<span>更新 <b class="num">' + esc(ok(d.updatedAt) ? fmt.time(d.updatedAt) : '--') + '</b> ' +
      (ok(d.updatedAt) ? fresh(d.updatedAt, { warn: 600, crit: 1800 }) : '') + '</span>' +
    '<span>K线 ' + esc(d.bar || '--') + '</span>' +
    '<span>全市场 <b class="num">' + esc(val(uni.swaps, 0)) + '</b> 个 swaps</span>' +
    '<span>耗时 <b class="num">' + esc(ok(d.tookMs) ? fmt.num(num(d.tookMs) / 1000, 1) + 's' : '--') + '</b></span>' +
    '<span class="muted">达标 ' + esc(val(uni.aboveVolume, 0)) + ' · 扫描 ' + esc(val(uni.scanned, 0)) + '</span>';

  // 主表
  if (!picked.length) {
    document.getElementById('cd-table').innerHTML =
      WB.empty('候选池为空', '点右上「立即选品」重跑全市场选品。', '🎯');
  } else {
    var rows = picked.map(function (c, i) {
      var rg = REGIME[c.regime] || [c.regime || '--', 'neutral'];
      var sc = c.score || {};
      return '<tr data-idx="' + i + '">' +
        '<td class="num muted">' + (i + 1) + '</td>' +
        '<td><b>' + esc(c.instId || '--') + '</b>' + (c.sector ? ' <span class="tiny muted">' + esc(c.sector) + '</span>' : '') + '</td>' +
        '<td class="num">' + esc(val(c.last, 5)) + '</td>' +
        '<td class="num">' + esc(compactUsd(c.notionalUsd)) + '</td>' +
        '<td class="num">' + esc(pct(c.atrPct)) + '</td>' +
        '<td class="num">' + esc(val(c.vr5, 3)) + '</td>' +
        '<td class="num"><b>' + esc(val(sc.total, 3)) + '</b></td>' +
        '<td>' + badge(rg[0], rg[1]) + ' ' + allowBadge(c.allowDirections) + '</td>' +
        '<td style="white-space:nowrap">' +
          '<button class="wb-btn is-small cd-open" data-idx="' + i + '" aria-label="开篮预览 ' + esc(c.instId || '') + '">开篮·预览</button> ' +
          '<button class="wb-row-toggle cd-detail" data-idx="' + i + '" aria-label="展开详情">详情 ▸</button>' +
        '</td></tr>';
    }).join('');
    document.getElementById('cd-table').innerHTML =
      '<div class="wb-table-wrap"><table class="wb-table"><thead><tr>' +
      '<th class="num">#</th><th>品种</th><th class="num">现价</th><th class="num">成交额</th>' +
      '<th class="num">ATR%</th><th class="num">VR5</th><th class="num">总分</th><th>状态 / 允许方向</th><th>操作</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  // 底部：评分公式 + rejectedSample
  var foot = '<details class="wb-details"><summary>评分公式说明</summary>' +
    '<div class="details-body">总分 = 回归性 × 波动率 × 流动性的加权合成（score.reversion / volatility / liquidity）。' +
    '回归性看 VR5（方差比，&lt;1 为均值回归，马丁友好）与 ρ₁（一阶自相关，&lt;0 为回归）；' +
    '波动率看 ATR%；流动性看成交额。regime=unclear 或 allowDirections 为空时不开新仓。</div></details>';
  var rej = Array.isArray(d.rejectedSample) ? d.rejectedSample : [];
  if (rej.length) {
    foot += '<details class="wb-details" style="margin-top:8px"><summary>被刷掉样本（' + rej.length + '）</summary>' +
      '<div class="details-body"><ul class="msg-list">' +
      rej.map(function (r) {
        return '<li><b>' + esc(r.instId || '--') + '</b>：' + esc(r.reason || '--') + '</li>';
      }).join('') + '</ul></div></details>';
  }
  document.getElementById('cd-foot').innerHTML = foot;
}

/** 候选池行内详情展开 */
function toggleCandidateDetail(idx, btn) {
  var d = S.candidates;
  var c = d && Array.isArray(d.picked) ? d.picked[idx] : null;

  var tr = btn.closest('tr');

    di('P₁ (ρ₁)', val(c.rho1, 3)) +
    di('回归频率 rf', val(c.rf, 3)) +
    di('ADX', val(c.adx, 0)) +
    di('费率 funding', pct(c.fundingPct, 3)) +
    di('回归性', val(sc.reversion, 3)) +
    di('波动率', val(sc.volatility, 3)) +
    di('流动性', val(sc.liquidity, 3)) +
    di('最小名义', usd(c.minNotionalUsd)) +
    di('合约面值 ctVal', val(c.ctVal, 4)) +
    di('最小下单 minSz', val(c.minSz, 4)) +

  tr.insertAdjacentHTML('afterend', html);

function renderVerify(d) {
  var el = document.getElementById('vf-body');
  var rep = d && d.report;
  if (!rep || rep.ok === false) {
    el.innerHTML = WB.empty('尚无验算报告', '后端尚未生成对账报告；点右上「刷新」重试。', '🔍');
    return;
  }

  var out = '';

  // 生成信息
  out += '<div class="toolbar">' +
    '<span>文件 <b>' + esc(d.file || '--') + '</b></span>' +
    '<span>生成于 <b class="num">' + esc(ok(rep.generatedAt) ? fmt.time(rep.generatedAt) : '--') + '</b> ' +
      (ok(rep.generatedAt) ? fresh(rep.generatedAt, { warn: 86400, crit: 604800 }) : '') + '</span>' +
    (rep.version !== undefined ? '<span>v' + esc(String(rep.version)) + '</span>' : '') +
    '</div>';

  // headline 指标网格
  out += '<div class="wb-card"><div class="card-head"><span class="card-title">headline</span></div>' +
    (kvGrid(rep.headline, null) || '<div class="tiny muted">headline 暂无可展示字段</div>') + '</div>';

  // 滑点表：优先找数组（rows/fills/items/list），否则 kv 网格
  var slip = rep.slippage || null;
  var slipRows = slip && (slip.rows || slip.fills || slip.items || slip.list);
  out += '<div class="wb-card"><div class="card-head"><span class="card-title">实测滑点</span></div>';
  if (Array.isArray(slipRows) && slipRows.length) {
    out += '<div class="wb-table-wrap"><table class="wb-table"><thead><tr>' +
      '<th class="num">时间</th><th>标的</th><th>类型</th><th>成交向</th>' +
      '<th class="num">信号价</th><th class="num">实际成交</th><th class="num">滑点 bps</th><th class="num">名义 U</th><th class="num">笔数</th>' +
      '</tr></thead><tbody>' +
      slipRows.map(function (r) {
        return '<tr>' +
          '<td class="num">' + esc(ok(r.ts || r.time) ? fmt.time(r.ts || r.time) : '--') + '</td>' +
          '<td><b>' + esc(r.instId || '--') + '</b></td>' +
          '<td>' + esc(r.type || '--') + '</td>' +

function renderReportList(d) {
  var el = document.getElementById('rp-list');
  var items = Array.isArray(d.items) ? d.items : (Array.isArray(d) ? d : []);
  if (!items.length) {

  }
  // 按 cycle（缺则 bucket）分组，保持出现顺序

          '<span class="rep-name">' + esc(it.name || p || '--') + '</span>' +
          '<span class="rep-meta">' + esc(ok(it.mtime) ? fmt.time(it.mtime) : '--') +

/** 加载报告全文：/api/report 可能返回 JSON 或纯文本，做双兼容 */
async function openReport(path, itemEl) {
  document.querySelectorAll('#rp-list .rep-item').forEach(function (n) { n.classList.remove('is-active'); });
  if (itemEl) itemEl.classList.add('is-active');
  var viewer = document.getElementById('rp-viewer');
  document.getElementById('rp-viewer-title').textContent = path;
  viewer.innerHTML = '<div class="wb-skel wb-skel-card"></div>';
  try {
    var resp = await fetch('/api/report?path=' + encodeURIComponent(path));
    if (!resp.ok) throw { error: 'HTTP ' + resp.status };
    var ct = resp.headers.get('content-type') || '';
    var text;
    if (ct.indexOf('json') >= 0) {
      var j = await resp.json();
      if (j && j.ok === false) throw { error: j.error || 'ok:false' };
      text = (j && (j.content || j.text || j.markdown || j.body)) || '';
    } else {
      text = await resp.text();
    }
    viewer.innerHTML = text ? renderMarkdown(text)
      : WB.empty('报告为空', '', '📄');
  } catch (e) {
    viewer.innerHTML = errBox(e && e.error);
  }
}

/** 轻量 markdown 美化：标题分级 + 代码块，其余等宽逐行 */
function renderMarkdown(text) {
  var out = '', inCode = false, codeBuf = '';
  String(text).split('\n').forEach(function (line) {
    if (/^\s*```/.test(line)) {
      if (inCode) { out += '<pre class="md-code">' + codeBuf + '</pre>'; codeBuf = ''; inCode = false; }
      else inCode = true;
      return;
    }
    if (inCode) { codeBuf += esc(line) + '\n'; return; }
    var m = /^(#{1,4})\s+(.*)$/.exec(line);
    if (m) {
      var lv = Math.min(m[1].length, 3);
      out += '<div class="md-h md-h' + lv + '">' + esc(m[2]) + '</div>';
      return;
    }
    out += '<div class="md-line">' + (esc(line) || ' ') + '</div>';
  });
  if (inCode) out += '<pre class="md-code">' + codeBuf + '</pre>';
  return '<div class="md-view">' + out + '</div>';
}

var plFields = [];       // schema fields
var plCurrent = {};      // 保存时基准值
var plDirty = {};        // key -> true

async function loadPolicy() {
  var el = document.getElementById('pl-body');
  if (!S.policy) el.innerHTML = '<div class="wb-skel wb-skel-card"></div><div class="wb-skel wb-skel-card"></div>';
  try {
    var d = await WB.api.get('/api/martin/policy-schema');
    S.policy = d;
    toastReset('policy');
    renderPolicy(d);
  } catch (e) {
    toastOnce('policy', '参数加载失败：' + (e && e.error || '网络错误'));
    el.innerHTML = errBox(e && e.error);
  }
}

function renderPolicy(d) {
  plFields = Array.isArray(d.fields) ? d.fields : [];
  plCurrent = (d.current && typeof d.current === 'object') ? Object.assign({}, d.current) : {};
  plDirty = {};

  if (!plFields.length) {
    document.getElementById('pl-body').innerHTML = WB.empty('参数 schema 为空', '后端未返回字段定义。', '⚙️');
    return;
  }

  // 预设条
  var presets = (d.presets && typeof d.presets === 'object') ? d.presets : {};
  var meta = d.meta || {};
  var sideEl = document.getElementById('pl-side');
  sideEl.innerHTML = '<span class="preset-bar">' +
    '<span class="preset-label">预设：</span>' +
    Object.keys(presets).map(function (name) {
      return '<button class="wb-btn is-small pl-preset" data-preset="' + esc(name) + '" aria-label="套用预设 ' + esc(name) + '">' + esc(name) + '</button>';
    }).join('') +
    (ok(meta.fullOccupancyPct) ? badge('满层占用 ' + fmt.num(num(meta.fullOccupancyPct), 1) + '%', 'brand') : '') +
    '</span>';

  // 分组（保持出现顺序）
  var groups = [], gseen = {};
  plFields.forEach(function (f) {
    var g = f.group || '其他';
    if (!gseen[g]) { gseen[g] = []; groups.push({ name: g, fields: gseen[g] }); }
    gseen[g].push(f);
  });

  var nav = '<nav class="policy-nav" aria-label="参数分组导航">' +
    groups.map(function (g, i) {
      return '<a href="javascript:void(0)" data-g="pg-' + i + '">' + esc(g.name) + '</a>';
    }).join('') + '</nav>';

  var cards = groups.map(function (g, i) {
    return '<div class="wb-card pg-card" id="pg-' + i + '">' +
      '<div class="card-head"><span class="card-title">' + esc(g.name) + '</span></div>' +
      g.fields.map(fieldRow).join('') + '</div>';
  }).join('');

  document.getElementById('pl-body').innerHTML =
    '<div class="policy-wrap">' + nav + '<div>' + cards +
    '<div id="pl-msg" style="margin-top:16px"></div>' +
    '<div class="policy-bar" style="margin-top:12px">' +
      '<span class="dirty-count" id="pl-dirty">未修改</span>' +
      '<span class="bar-actions">' +
        '<button class="wb-btn" id="pl-reset" aria-label="重置为当前生效值">重置</button>' +
        '<button class="wb-btn is-primary" id="pl-save" aria-label="保存并应用参数">保存并应用</button>' +
      '</span>' +
    '</div></div></div>';

  bindPolicyEvents();
  updateDirtyBar();
}

function fieldRow(f) {
  var key = f.key || '';
  var cur = plCurrent[key];
  var input;
  if (f.type === 'enum') {
    var opts = Array.isArray(f.options) ? f.options : [];
    input = '<select class="wb-select" data-key="' + esc(key) + '">' +
      opts.map(function (o) {
        var v = (o && typeof o === 'object') ? (o.value !== undefined ? o.value : o.label) : o;
        var t = (o && typeof o === 'object') ? (o.label !== undefined ? o.label : o.value) : o;
        return '<option value="' + esc(v) + '"' + (String(cur) === String(v) ? ' selected' : '') + '>' + esc(t) + '</option>';
      }).join('') + '</select>';
  } else {
    input = '<input class="wb-input num" type="number" data-key="' + esc(key) + '"' +
      (ok(f.min) ? ' min="' + esc(String(f.min)) + '"' : '') +
      (ok(f.max) ? ' max="' + esc(String(f.max)) + '"' : '') +
      (ok(f.step) ? ' step="' + esc(String(f.step)) + '"' : ' step="any"') +
      ' value="' + esc(cur === undefined || cur === null ? '' : String(cur)) + '">';
  }
  return '<div class="wb-field" data-key="' + esc(key) + '">' +
    '<div class="field-label">' + esc(f.label || key) +
      (f.unit ? '<span class="field-unit">' + esc(f.unit) + '</span>' : '') + '</div>' +
    '<div class="field-input">' + input + '</div>' +
    '<div class="field-hint">' + esc(f.hint || '') +
      '<span class="wb-badge is-danger field-warn" hidden>⚠ 偏高</span></div>' +
    '</div>';
}

function fieldInputValue(f, input) {
  if (f.type === 'enum') return input.value;
  var n = num(input.value);
  return isFinite(n) ? n : input.value;
}

function sameVal(a, b) { return String(a) === String(b); }

/** 重算 dirty + danger 标记 */
function recalcPolicy() {
  plDirty = {};
  plFields.forEach(function (f) {
    var input = document.querySelector('#pl-body [data-key="' + CSS.escape(f.key || '') + '"].wb-input, #pl-body [data-key="' + CSS.escape(f.key || '') + '"].wb-select');
    if (!input) return;
    var v = fieldInputValue(f, input);
    if (!sameVal(v, plCurrent[f.key] === undefined ? '' : plCurrent[f.key])) plDirty[f.key] = true;

    // danger 阈值
    var row = input.closest('.wb-field');
    var warnBadge = row ? row.querySelector('.field-warn') : null;
    var danger = num(f.danger);
    var over = f.type !== 'enum' && isFinite(danger) && isFinite(num(input.value)) && num(input.value) >= danger;
    if (row) row.classList.toggle('is-danger', !!over);
    if (warnBadge) warnBadge.hidden = !over;
  });
  updateDirtyBar();
}

function updateDirtyBar() {
  var n = Object.keys(plDirty).length;
  var el = document.getElementById('pl-dirty');
  if (el) el.textContent = n ? '已改 ' + n + ' 项' : '未修改';
  var save = document.getElementById('pl-save');
  if (save) save.disabled = !n;
}

function bindPolicyEvents() {
  var body = document.getElementById('pl-body');
  body.querySelectorAll('.wb-input, .wb-select').forEach(function (input) {
    input.addEventListener('input', recalcPolicy);
    input.addEventListener('change', recalcPolicy);
  });
  // 锚点导航
  body.querySelectorAll('.policy-nav a').forEach(function (a) {
    a.addEventListener('click', function () {
      var t = document.getElementById(a.getAttribute('data-g'));
      if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  document.getElementById('pl-reset').addEventListener('click', resetPolicyForm);
  document.getElementById('pl-save').addEventListener('click', savePolicy);
}

function resetPolicyForm() {
  plFields.forEach(function (f) {
    var input = document.querySelector('#pl-body .wb-input[data-key="' + CSS.escape(f.key || '') + '"], #pl-body .wb-select[data-key="' + CSS.escape(f.key || '') + '"]');
    if (!input) return;
    var cur = plCurrent[f.key];
    input.value = cur === undefined || cur === null ? '' : String(cur);
  });
  plDirty = {};
  document.getElementById('pl-msg').innerHTML = '';
  recalcPolicy();
}

/** 套用预设：填入表单并标记 dirty */
function applyPreset(name) {
  var presets = (S.policy && S.policy.presets) || {};
  var p = presets[name];
  if (!p || typeof p !== 'object') { WB.toast('预设「' + name + '」无数据', 'error'); return; }
  plFields.forEach(function (f) {
    if (!(f.key in p)) return;
    var input = document.querySelector('#pl-body .wb-input[data-key="' + CSS.escape(f.key || '') + '"], #pl-body .wb-select[data-key="' + CSS.escape(f.key || '') + '"]');
    if (input) input.value = String(p[f.key]);
  });
  recalcPolicy();
  WB.toast('已套用预设「' + name + '」，请检查后保存', 'info');
}

/** 保存：body = 改动字段集；展示 note/occupiedPct/errors/warnings/clamped */
async function savePolicy() {
  var body = {};
  plFields.forEach(function (f) {
    if (!plDirty[f.key]) return;
    var input = document.querySelector('#pl-body .wb-input[data-key="' + CSS.escape(f.key || '') + '"], #pl-body .wb-select[data-key="' + CSS.escape(f.key || '') + '"]');
    if (input) body[f.key] = fieldInputValue(f, input);
  });
  if (!Object.keys(body).length) return;

  var btn = document.getElementById('pl-save');
  btn.classList.add('is-loading');
  var msgEl = document.getElementById('pl-msg');
  try {
    var r = await WB.api.post('/api/martin/policy', body);
    handlePolicyResult(r);
    WB.toast('参数已保存并应用', 'success');
  } catch (e) {
    // api 对 ok:false 也会抛，带 data 时照样渲染校验信息
    if (e && e.data) handlePolicyResult(e.data);
    WB.toast('保存失败：' + (e && e.error || '网络错误'), 'error');
  } finally {
    btn.classList.remove('is-loading');
  }
}

function handlePolicyResult(r) {
  var msgEl = document.getElementById('pl-msg');
  var v = r.validation || {};
  var out = '';

  var errors = [].concat(v.errors || [], r.rejected || []).filter(Boolean);
  if (errors.length) {
    out += '<div class="wb-alert is-danger">⛔ 校验错误：<ul class="msg-list">' +
      errors.map(function (x) { return '<li>' + esc(typeof x === 'string' ? x : JSON.stringify(x)) + '</li>'; }).join('') +
      '</ul></div>';
  }
  if (Array.isArray(v.warnings) && v.warnings.length) {
    out += '<div class="wb-alert is-warning" style="margin-top:8px">⚠ 告警：<ul class="msg-list">' +
      v.warnings.map(function (x) { return '<li>' + esc(typeof x === 'string' ? x : JSON.stringify(x)) + '</li>'; }).join('') +
      '</ul></div>';
  }
  if (Array.isArray(v.clamped) && v.clamped.length) {
    out += '<div class="wb-alert" style="margin-top:8px">ℹ 以下字段被夹取到边界：' +
      esc(v.clamped.map(function (c) { return typeof c === 'string' ? c : (c.key || JSON.stringify(c)); }).join('、')) + '</div>';
  }
  var notes = [];
  if (r.note) notes.push(esc(String(r.note)));
  if (ok(r.occupiedPct)) notes.push('保存后占用 <b class="num">' + esc(fmt.num(num(r.occupiedPct), 1)) + '%</b>');
  if (notes.length) out += '<div class="wb-alert" style="margin-top:8px">' + notes.join(' · ') + '</div>';
  msgEl.innerHTML = out;

  // 更新基准值并清 dirty
  if (r.policy && typeof r.policy === 'object') {
    plCurrent = Object.assign({}, plCurrent, r.policy);
  } else {
    Object.keys(plDirty).forEach(function (k) { /* 保守：不更新 */ });
  }
  if (!errors.length) {
    plFields.forEach(function (f) {
      var input = document.querySelector('#pl-body .wb-input[data-key="' + CSS.escape(f.key || '') + '"], #pl-body .wb-select[data-key="' + CSS.escape(f.key || '') + '"]');
      if (input && plCurrent[f.key] !== undefined) input.value = String(plCurrent[f.key]);
    });
    plDirty = {};
    recalcPolicy();
    // 同步满层占用徽标
    if (r.validation && r.validation.meta && ok(r.validation.meta.fullOccupancyPct)) {
      S.policy.meta = Object.assign({}, S.policy.meta, r.validation.meta);
    }
  }
}

/** 分组锚点高亮（scroll spy） */
function policyScrollSpy() {
  if (activeSection !== 'policy') return;

  document.querySelectorAll('#pl-body .policy-nav a').forEach(function (a) {

/* ==================== 路由 / 区块调度 ==================== */

var SECTIONS = {
  overview: {
    enter: function () {
      if (S.state) renderOverview(S.state);
      if (!S.baskets) loadBaskets(); // 资金效率依赖 baskets.totals
      loadBacktest();
      onHealthCheck();
    },
    reload: function () { loadBacktest(); onHealthCheck(); },
  },
  baskets: {
    enter: function () { sectionPollers.baskets = WB.poll(loadBaskets, 5000); },
    reload: loadBaskets,
  },
  candidates: {
    enter: function () { sectionPollers.candidates = WB.poll(loadCandidates, 10000); },
    reload: loadCandidates,
  },
  pnl: {
    enter: function () { renderPnl(); if (!S.baskets) loadBaskets(); },
    reload: function () { loadBaskets(); renderPnl(); },
  },
  verify: { enter: loadVerify, reload: loadVerify },
  report: { enter: loadReports, reload: loadReports },
  log: {
    enter: function () { renderLogs(S.state); },
    reload: function () { renderLogs(S.state); },
  },
  policy: { enter: loadPolicy, reload: loadPolicy },
};

function routeKey() {
  var h = (location.hash || '').replace(/^#\/?/, '');
  return SECTIONS[h] ? h : 'overview';
}

function activate(key) {
  if (!SECTIONS[key]) key = 'overview';
  activeSection = key;

  // 区块 display 切换
  document.querySelectorAll('.page-section').forEach(function (sec) {
    sec.classList.toggle('is-active', sec.getAttribute('data-key') === key);
  });
  // 侧栏高亮
  document.querySelectorAll('.wb-nav-item').forEach(function (a) {
    a.classList.toggle('is-active', a.getAttribute('data-key') === key);
  });
  // 停掉上一个区块的轮询
  Object.keys(sectionPollers).forEach(function (k) {
    sectionPollers[k]();
    delete sectionPollers[k];
  });

  var sec = SECTIONS[key];
  if (sec && sec.enter) sec.enter();

  // 切区块时回到顶部
  window.scrollTo({ top: 0 });
}

    if (t.id === 'ov-breaker-clear') { onBreakerClear(); return; }
    if (t.classList.contains('cd-open')) { onOpenPreview(Number(t.getAttribute('data-idx')), t); return; }
    if (t.classList.contains('cd-detail')) { toggleCandidateDetail(Number(t.getAttribute('data-idx')), t); return; }
    if (t.classList.contains('pl-preset')) { applyPreset(t.getAttribute('data-preset')); return; }
    if (t.classList.contains('rep-item')) { openReport(t.getAttribute('data-path'), t); return; }
  });
  // 报告列表键盘可达
  document.getElementById('rp-list').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var t = e.target.closest('.rep-item');
    if (t) { e.preventDefault(); openReport(t.getAttribute('data-path'), t); }
  });

  window.addEventListener('scroll', policyScrollSpy, { passive: true });
  window.addEventListener('hashchange', function () { activate(routeKey()); });
}

function boot() {
  WB.shell.init(routeKey(), { onPause: onPause, onRefresh: onRefresh, onSystem: onSystem });
  bindStaticEvents();
  activate(routeKey());
  // 全局 5s 轮询 state（顶栏生命体征 + 概览/日志/收益联动）
  WB.poll(loadState, 5000);
  // 后台预取 policy-schema：资金效率的「满层占用上限 / 单层名义预算」依赖它
  WB.api.get('/api/martin/policy-schema').then(function (d) {
    S.policy = d;
    if (activeSection === 'overview') renderEfficiencyInto('ov-eff');
    if (activeSection === 'pnl') renderEfficiencyInto('pnl-eff');
  }).catch(function () { /* 缺则资金效率对应位显示 "--" */ });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
